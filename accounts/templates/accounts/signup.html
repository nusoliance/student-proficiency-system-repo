{% extends 'base.html' %}

{% block content %}
<h2>Sign Up</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
</form>

<script>
    const roleField = document.getElementById('id_role');
    const modeRow = document.getElementById('id_mode').closest('p');
    const courseRow = document.getElementById('id_course').closest('p');

    function toggleStudentFields() {
        const isStudent = roleField.value === 'student';
        modeRow.style.display = isStudent ? '' : 'none';
        courseRow.style.display = isStudent ? '' : 'none';
    }

    roleField.addEventListener('change', toggleStudentFields);
    toggleStudentFields();
</script>
{% endblock %}
