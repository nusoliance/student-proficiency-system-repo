{% extends 'base.html' %}
{% block content %}
<div class="login-section">
    <div class="sgnup-part">
        <h2>Sign Up</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="btn-lgn">
                <button type="submit">Sign Up</button>
            </div>
        </form>
        <p class="frgt">Already have an account? <a href="{% url 'login' %}" class="sgnup">Log in</a></p>
    </div>
</div>

<script>
    const roleField = document.getElementById('id_role');
    const modeField = document.getElementById('id_mode');
    const schoolField = document.getElementById('id_school');
    const modeRow = modeField.closest('p');
    const courseRow = document.getElementById('id_course').closest('p');
    const schoolRow = schoolField.closest('p');
    const schoolIdRow = document.getElementById('id_school_id').closest('p');

    function toggleFields() {
        const isStudent = roleField.value === 'student';
        const isProfessionalStudent = isStudent && modeField.value === 'professional';
        const isCituProfessionalStudent = isProfessionalStudent && schoolField.value === 'citu';

        modeRow.style.display = isStudent ? '' : 'none';
        courseRow.style.display = isStudent ? '' : 'none';
        schoolRow.style.display = (roleField.value === 'teacher' || isProfessionalStudent) ? '' : 'none';
        schoolIdRow.style.display = isCituProfessionalStudent ? '' : 'none';
    }

    roleField.addEventListener('change', toggleFields);
    modeField.addEventListener('change', toggleFields);
    schoolField.addEventListener('change', toggleFields);
    toggleFields();
</script>
{% endblock %}
