<!DOCTYPE html>
<html>

<head>
    <title>Student Proficiency System</title>
</head>

<body>
    <nav>
        {% if user.is_authenticated %}
        <span>Welcome, {{ user.username }} ({{ user.profile.role }})</span>
        |
        {% if user.profile.role == 'teacher' %}
        <a href="{% url 'subject_list' %}">My Subjects</a>
        {% else %}
        <a href="{% url 'subject_list' %}">My Subjects</a>
        <a href="{% url 'my_skills' %}">My Skills</a>
        {% endif %}
        |
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
        {% else %}
        <a href="{% url 'login' %}">Log In</a>
        <a href="{% url 'signup' %}">Sign Up</a>
        {% endif %}
    </nav>
    <hr>

    {% block content %}
    {% endblock %}

</body>

</html>
