{% extends 'base.html' %}
{% block content %}
<div class="form-card">
<h2>Add Quiz to {{ topic.title }}</h2>
<form method="post" enctype="multipart/form-data" class="custom-form">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="btn-primary">Create &amp; Add Skills</button>
        <a href="{% url 'topic_quizzes' topic.id %}" class="btn-cancel">Cancel</a>
    </div>
</form>
</div>
{% endblock %}
