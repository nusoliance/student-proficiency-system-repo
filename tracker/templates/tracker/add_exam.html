{% extends 'base.html' %}
{% block content %}
<div class="form-card">
<h2>{% if editing %}Edit {{ exam_type_label }}{% else %}Create {{ exam_type_label }}{% endif %} — {{ subject.name }}</h2>
<form method="post" enctype="multipart/form-data" class="custom-form">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="btn-primary">{% if editing %}Save Changes{% else %}Create &amp; Add Skills{% endif %}</button>
        {% if editing %}
        <a href="{% url 'exam_detail' exam.id %}" class="btn-cancel">Cancel</a>
        {% else %}
        <a href="{% url 'lesson_plan_view' subject.id %}" class="btn-cancel">Cancel</a>
        {% endif %}
    </div>
    
        <script>
        document.addEventListener('DOMContentLoaded', function () {
            var unknownBox = document.getElementById('id_unknown_max_score');
            var maxScore = document.getElementById('id_max_score');
            var passingPct = document.getElementById('id_passing_percentage');
            function toggle() {
                var unknown = unknownBox.checked;
                maxScore.disabled = unknown;
                passingPct.disabled = unknown;
                if (unknown) { maxScore.value = ''; passingPct.value = ''; }
            }
            unknownBox.addEventListener('change', toggle);
            toggle();
        });
        </script>
</form>
</div>
{% endblock %}
